# Minimal local stack for Puptoo: Kafka (KRaft), RustFS, Redis.
# Nothing is stood up for uploads or to consume the inventory messages.
#
# Two puptoo instances run side by side, each scoped to a handler set:
#   puptoo      — advisor, compliance, malware-detection → platform.inventory.host-ingress-p1 (port 8000)
#   puptoo-qpc  — qpc → platform.inventory.host-ingress (port 8001)
#
# Usage:
#   podman compose up --build
#   podman compose down -v   # tear down including volumes

services:

  kafka:
    image: docker.io/confluentinc/cp-kafka:8.2.1
    container_name: puptoo-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: DOCKER://0.0.0.0:29092,LOCALHOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka:29092,LOCALHOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: DOCKER:PLAINTEXT,LOCALHOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        - CMD-SHELL
        - |
          kafka-topics --bootstrap-server localhost:29092 --create --if-not-exists \
            --topic platform.upload.announce --replication-factor 1 --partitions 1 && \
          kafka-topics --bootstrap-server localhost:29092 --create --if-not-exists \
            --topic platform.inventory.host-ingress-p1 --replication-factor 1 --partitions 1 && \
          kafka-topics --bootstrap-server localhost:29092 --create --if-not-exists \
            --topic platform.inventory.host-ingress --replication-factor 1 --partitions 1 && \
          kafka-topics --bootstrap-server localhost:29092 --create --if-not-exists \
            --topic platform.upload.validation --replication-factor 1 --partitions 1 && \
          kafka-topics --bootstrap-server localhost:29092 --create --if-not-exists \
            --topic platform.payload-status --replication-factor 1 --partitions 1 && \
          kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 30s

  rustfs:
    image: docker.io/rustfs/rustfs:1.0.0
    container_name: puptoo-rustfs
    hostname: rustfs
    restart: unless-stopped
    command: "server --address 0.0.0.0:9000 --console-address 0.0.0.0:9001 /data"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ACCESS_KEY:-minioaccess}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_SECRET_KEY:-miniosecret}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - rustfs-data:/data

  createbuckets:
    image: docker.io/rustfs/rc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      rc alias set myrustfs http://rustfs:9000 ${RUSTFS_ACCESS_KEY:-minioaccess} ${RUSTFS_SECRET_KEY:-miniosecret};
      rc mb --ignore-existing myrustfs/insights-upload-perma;
      rc mb --ignore-existing myrustfs/insights-upload-rejected;
      rc mb --ignore-existing myrustfs/insights-upload-puptoo;
      rc anonymous set public myrustfs/insights-upload-perma;
      rc anonymous set public myrustfs/insights-upload-rejected;
      rc anonymous set public myrustfs/insights-upload-puptoo;
      exit 0;
      "

  redis:
    image: docker.io/library/redis:7
    container_name: puptoo-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  tempo:
    image: grafana/tempo:2.7.1
    container_name: puptoo-tempo
    hostname: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../.otel/tempo.yaml:/etc/tempo.yaml
    ports:
      - "4318:4318"
      - "3200:3200"

  grafana:
    image: grafana/grafana:11.5.2
    container_name: puptoo-grafana
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ../.otel/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - tempo

  puptoo:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: puptoo
    hostname: puptoo
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: DEBUG
      CLOWDER_ENABLED: "False"
      BOOTSTRAP_SERVERS: kafka:29092
      S3_ENDPOINT: rustfs:9000
      PUPTOO_BUCKET: insights-upload-puptoo
      STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-minioaccess}
      STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:-miniosecret}
      USE_SSL: "False"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DISABLE_REDIS: "False"
      ENABLED_HANDLERS: "advisor,compliance,malware-detection"
      INVENTORY_TOPIC: platform.inventory.host-ingress-p1
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      kafka:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      tempo:
        condition: service_started

  puptoo-qpc:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: puptoo-qpc
    hostname: puptoo-qpc
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      LOG_LEVEL: DEBUG
      CLOWDER_ENABLED: "False"
      BOOTSTRAP_SERVERS: kafka:29092
      S3_ENDPOINT: rustfs:9000
      PUPTOO_BUCKET: insights-upload-puptoo
      STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-minioaccess}
      STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:-miniosecret}
      USE_SSL: "False"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DISABLE_REDIS: "False"
      APP_NAME: puptoo-qpc
      ENABLED_HANDLERS: "qpc"
      INVENTORY_TOPIC: platform.inventory.host-ingress
      QPC_PROCESSING_ENABLED: ${QPC_PROCESSING_ENABLED:-false}
      QPC_ORG_MIGRATION_ENABLED: ${QPC_ORG_MIGRATION_ENABLED:-false}
      QPC_HOSTS_TRANSFORMATION_ENABLED: ${QPC_HOSTS_TRANSFORMATION_ENABLED:-false}
      QPC_ORG_MIGRATION_LIST: ${QPC_ORG_MIGRATION_LIST:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      kafka:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      tempo:
        condition: service_started

volumes:
  kafka-data:
  rustfs-data:
  redis-data:
